name: Deploy Payload CMS to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST

    defaults:
      run:
        working-directory: zakarpattia-backend-payload

    steps:
      # 1️⃣ Забираємо код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node.js (під engines)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zakarpattia-backend-payload/package-lock.json

      # 3️⃣ Залежності
      - name: Install dependencies
        run: npm install

      # 4️⃣ БІЛД (ТУТ build Є)
      - name: Build project
        run: npm run build

      # 5️⃣ SSH агент
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 7️⃣ КОПІЮЄМО ГОТОВИЙ БІЛД
      - name: Upload to VPS
        run: |
          rsync -az --delete \
          --exclude=node_modules \
          --exclude=.git \
          -e "ssh -o StrictHostKeyChecking=no" \
          zakarpattia-backend-payload/ \
          ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}


      # 8️⃣ PM2 restart / start
      - name: Restart PM2
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            cd ${{ secrets.VPS_PATH }} &&
            pm2 restart zakarpattia-payload || pm2 start npm --name zakarpattia-payload -- start
          "
