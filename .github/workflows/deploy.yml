name: Deploy Payload CMS to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zakarpattia-backend-payload/package-lock.json

      # 3️⃣ Install
      - name: Install deps
        working-directory: zakarpattia-backend-payload
        run: npm install

      # 4️⃣ Build
      - name: Build
        working-directory: zakarpattia-backend-payload
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URI_PROD: ${{ secrets.DATABASE_URI_PROD }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run build

      # 5️⃣ SSH agent
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 6️⃣ Deploy (ТУТ ВСЕ ПРАВИЛЬНО)
      - name: Upload to VPS
        run: |
          rsync -az --delete \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.env \
            --exclude=text.tsx\
            -e "ssh -o StrictHostKeyChecking=no" \
            zakarpattia-backend-payload/ \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}
      - name: Check .env on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
          cd ${{ secrets.VPS_PATH }} &&
          echo '.env contents:' &&
          cat .env
          "
      # 7️⃣ PM2
      - name: Restart PM2
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
              cd ${{ secrets.VPS_PATH }} &&
              pm2 restart zakarpattia-payload || pm2 start npm --name zakarpattia-payload -- start
            "
