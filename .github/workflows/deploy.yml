name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST  # <- підключає environment secrets

    steps:
      # 1️⃣ Клонування репозиторію на runner
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Підключення SSH ключа
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # 3️⃣ Перевірка секретів
      - name: Check secrets
        run: |
          echo "VPS_HOST: ${{ secrets.VPS_HOST }}"
          echo "VPS_USERNAME: ${{ secrets.VPS_USERNAME }}"
          echo "VPS_PATH: '${{ secrets.VPS_PATH }}'"

      # 4️⃣ Деплой на VPS
      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            cd '${{ secrets.VPS_PATH }}' &&
            git pull &&
            npm install &&
            npm run build
          "
